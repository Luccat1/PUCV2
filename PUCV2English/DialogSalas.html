<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; padding: 20px; margin: 0; color: #333; }
    h1 { color: #003366; font-size: 20px; margin-top: 0; }
    label { display: block; font-weight: 500; margin-bottom: 4px; margin-top: 14px; color: #003366; }
    input[type="text"] {
      width: 100%; box-sizing: border-box; padding: 8px 10px;
      border: 1px solid #ced4da; border-radius: 4px; font-size: 14px;
    }
    input[type="text"]:focus { outline: none; border-color: #0055a2; }
    .preview-box {
      background: #e9f2fa; border-left: 4px solid #0055a2;
      padding: 14px; border-radius: 4px; margin: 16px 0;
      white-space: pre-line; font-size: 14px; line-height: 1.6;
    }
    .result-box {
      padding: 14px; border-radius: 4px; margin: 16px 0;
      font-size: 14px; white-space: pre-line; line-height: 1.6;
    }
    .result-ok { background: #d4edda; color: #155724; }
    .result-err { background: #f8d7da; color: #721c24; }
    .btn-group { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; }
    button { padding: 10px 20px; border-radius: 4px; border: none; font-weight: 700; cursor: pointer; }
    .btn-primary { background: #0055a2; color: white; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: #e9ecef; color: #495057; }
    .spinner-wrap { text-align: center; padding: 30px 0; }
    .spinner {
      border: 4px solid #f3f3f3; border-top: 4px solid #0055a2;
      border-radius: 50%; width: 30px; height: 30px;
      animation: spin 1s linear infinite; display: inline-block;
      vertical-align: middle; margin-right: 10px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>🏫 Inicio de Clases</h1>

  <!-- STATE: LOADING -->
  <div id="state-loading">
    <div class="spinner-wrap">
      <div class="spinner"></div>
      <span>Cargando niveles activos...</span>
    </div>
  </div>

  <!-- STATE: FORM — hidden until niveles load -->
  <div id="state-form" style="display:none">
    <p>Ingresa la sala de clases para cada nivel activo antes de enviar los correos.</p>
    <div id="sala-fields"><!-- inputs rendered by JS --></div>
    <div class="btn-group">
      <button class="btn-secondary" onclick="google.script.host.close()">Cancelar</button>
      <button id="btn-preview" class="btn-primary" onclick="submitSalas()">Continuar →</button>
    </div>
    <div id="form-spinner" class="spinner-wrap" style="display:none">
      <div class="spinner"></div>
      <span>Verificando salas...</span>
    </div>
  </div>

  <!-- STATE: PREVIEW — hidden until step 1 success -->
  <div id="state-preview" style="display:none">
    <p><strong>Confirma el envío antes de proceder:</strong></p>
    <div id="preview-text" class="preview-box"></div>
    <div class="btn-group">
      <button class="btn-secondary" onclick="showForm()">← Volver</button>
      <button id="btn-confirm" class="btn-primary" onclick="confirmarEnvio()">Enviar correos</button>
    </div>
    <div id="confirm-spinner" class="spinner-wrap" style="display:none">
      <div class="spinner"></div>
      <span>Enviando correos...</span>
    </div>
  </div>

  <!-- STATE: RESULT — hidden until send completes -->
  <div id="state-result" style="display:none">
    <div id="result-text" class="result-box"></div>
    <div class="btn-group">
      <button class="btn-primary" onclick="google.script.host.close()">Cerrar</button>
    </div>
  </div>

  <script>
    var niveles = [];

    function showState(name) {
      ['loading','form','preview','result'].forEach(function(s) {
        document.getElementById('state-' + s).style.display = (s === name) ? '' : 'none';
      });
    }

    function showForm() {
      showState('form');
    }

    // On load: fetch active levels from server
    window.onload = function() {
      google.script.run
        .withSuccessHandler(function(result) {
          niveles = result;
          if (!niveles || niveles.length === 0) {
            showState('result');
            var box = document.getElementById('result-text');
            box.textContent = 'No hay estudiantes pendientes de notificación de inicio de clases en Lista Final Curso.';
            box.className = 'result-box result-ok';
            return;
          }
          var container = document.getElementById('sala-fields');
          container.innerHTML = '';
          niveles.forEach(function(n) {
            var lbl = document.createElement('label');
            lbl.textContent = 'Sala — ' + n;
            lbl.setAttribute('for', 'sala-' + n);
            var inp = document.createElement('input');
            inp.type = 'text';
            inp.id = 'sala-' + n;
            inp.name = n;
            inp.placeholder = 'Ej: Sala 101';
            inp.autocomplete = 'off';
            container.appendChild(lbl);
            container.appendChild(inp);
          });
          showState('form');
        })
        .withFailureHandler(function(err) {
          showState('result');
          var box = document.getElementById('result-text');
          box.textContent = 'Error al cargar niveles: ' + err.message;
          box.className = 'result-box result-err';
        })
        .getNivelesActivos();
    };

    function submitSalas() {
      var salas = {};
      var allFilled = true;
      niveles.forEach(function(n) {
        var val = document.getElementById('sala-' + n).value.trim();
        if (!val) allFilled = false;
        salas[n] = val;
      });
      if (!allFilled) {
        alert('Por favor ingresa sala para todos los niveles antes de continuar.');
        return;
      }

      document.getElementById('btn-preview').disabled = true;
      document.getElementById('form-spinner').style.display = '';

      google.script.run
        .withSuccessHandler(function(preview) {
          document.getElementById('btn-preview').disabled = false;
          document.getElementById('form-spinner').style.display = 'none';
          document.getElementById('preview-text').textContent = preview;
          showState('preview');
        })
        .withFailureHandler(function(err) {
          document.getElementById('btn-preview').disabled = false;
          document.getElementById('form-spinner').style.display = 'none';
          alert('Error: ' + err.message);
        })
        .guardarSalasYObtenerPreview(salas);
    }

    function confirmarEnvio() {
      document.getElementById('btn-confirm').disabled = true;
      document.getElementById('confirm-spinner').style.display = '';

      google.script.run
        .withSuccessHandler(function(msg) {
          document.getElementById('btn-confirm').disabled = false;
          document.getElementById('confirm-spinner').style.display = 'none';
          showState('result');
          var box = document.getElementById('result-text');
          box.textContent = msg;
          box.className = 'result-box ' + (msg.startsWith('ERROR') ? 'result-err' : 'result-ok');
        })
        .withFailureHandler(function(err) {
          document.getElementById('btn-confirm').disabled = false;
          document.getElementById('confirm-spinner').style.display = 'none';
          showState('result');
          var box = document.getElementById('result-text');
          box.textContent = 'Error al enviar: ' + err.message;
          box.className = 'result-box result-err';
        })
        .enviarCorreosInicioClases();
    }
  </script>
</body>
</html>
